<script>
document.addEventListener('DOMContentLoaded', () => {
    // База данных датчиков из вашего mcp_server.py
    const knownCoords = {
        "т1": "Камера ситуационной видеоаналитики — Периметр Юг",
        "т2": "Датчик СКУД — Вход в терминал А",
        "т3": "Извещатель охранный — Зона транспортной безопасности",
        "т4": "Камера распознавания номеров — КПП-1",
        "т5": "Сенсор целостности ограждения — Сектор 5"
    };

    const testBtn = document.querySelector('button, input[type="button"]'); // Находим вашу кнопку
    const logTableBody = document.querySelector('table:last-of-type tbody'); // Находим таблицу логов

    if (testBtn && logTableBody) {
        testBtn.addEventListener('click', (e) => {
            e.preventDefault();
            
            // Выбираем случайный датчик
            const keys = Object.keys(knownCoords);
            const randomKey = keys[Math.floor(Math.random() * keys.length)];
            const sensorDesc = knownCoords[randomKey];
            
            // Получаем текущее время
            const now = new Date();
            const timeStr = now.toLocaleDateString('ru-RU') + ' ' + now.toLocaleTimeString('ru-RU');
            
            // Создаем новую строку лога, имитирующую AddEvent из MCP
            const newRow = document.createElement('tr');
            newRow.innerHTML = `
                <td>${timeStr}</td>
                <td><span style="color: #ff3b30; font-weight: bold;">[CRITICAL]</span></td>
                <td>mcp_server.py</td>
                <td><strong>AddEvent:</strong> Сработал датчик ${randomKey} (${sensorDesc}). Сигнал передан в обработку моделей угроз.</td>
            `;
            
            // Добавляем запись в самое начало журнала логов
            logTableBody.insertBefore(newRow, logTableBody.firstChild);
            
            // Небольшая визуальная индикация успеха
            const originalText = testBtn.innerText || testBtn.value;
            testBtn.innerText = "✓ Запрос отправлен";
            testBtn.style.backgroundColor = "#34c759";
            setTimeout(() => {
                testBtn.innerText = originalText;
                testBtn.style.backgroundColor = "";
            }, 1500);
        });
    }
});
</script>
